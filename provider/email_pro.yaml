identity:
  author: "dq"
  name: "email_pro"
  label:
    en_US: "email_pro"
    zh_Hans: "email_pro"
    pt_BR: "email_pro"
    ja_JP: "email_pro"
  description:
    en_US: "Email tools - search and send emails via SMTP/IMAP"
    zh_Hans: "邮件工具 - 通过 SMTP/IMAP 检索和发送邮件"
    pt_BR: "Email tools - search and send emails via SMTP/IMAP"
    ja_JP: "メールツール - SMTP/IMAP でメールの検索と送信"
  icon: "icon.svg"

credentials_for_provider:
  smtp_host:
    type: "text-input"
    required: true
    label:
      en_US: "SMTP Server"
      zh_Hans: "SMTP 服务器地址"
    placeholder:
      en_US: "e.g. smtp.gmail.com"
      zh_Hans: "例如 smtp.gmail.com"
    help:
      en_US: "The SMTP server host for sending emails."
      zh_Hans: "用于发送邮件的 SMTP 服务器地址。"
  smtp_port:
    type: "text-input"
    required: true
    label:
      en_US: "SMTP Port"
      zh_Hans: "SMTP 端口"
    placeholder:
      en_US: "e.g. 587"
      zh_Hans: "例如 587"
    help:
      en_US: "The SMTP server port (commonly 587 for TLS, 465 for SSL)."
      zh_Hans: "SMTP 服务器端口（TLS 常用 587，SSL 常用 465）。"
  email_account:
    type: "text-input"
    required: true
    label:
      en_US: "Email Address"
      zh_Hans: "邮箱地址"
    placeholder:
      en_US: "your@email.com"
      zh_Hans: "your@email.com"
    help:
      en_US: "The email address used for authentication."
      zh_Hans: "用于认证的邮箱地址。"
  email_password:
    type: "secret-input"
    required: true
    label:
      en_US: "Email Password / App Password"
      zh_Hans: "邮箱密码 / 应用专用密码"
    placeholder:
      en_US: "Enter your email password or app-specific password"
      zh_Hans: "输入邮箱密码或应用专用密码"
    help:
      en_US: "The password or app-specific password for the email account."
      zh_Hans: "邮箱密码或应用专用密码。"
  encrypt_method:
    type: "select"
    required: true
    default: "TLS"
    options:
      - value: "TLS"
        label:
          en_US: "START TLS"
          zh_Hans: "START TLS加密"
      - value: "SSL"
        label:
          en_US: "SSL"
          zh_Hans: "SSL加密"
      - value: "NONE"
        label:
          en_US: "NONE"
          zh_Hans: "无加密"
    label:
      en_US: "Encryption Method"
      zh_Hans: "加密方式"
    help:
      en_US: "The encryption method for SMTP connection."
      zh_Hans: "SMTP 连接的加密方式。"

tools:
  - tools/email_pro.yaml
  - tools/search_email.yaml
extra:
  python:
    source: provider/email_pro.py
