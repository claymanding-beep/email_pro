identity:
  name: "email_pro"
  author: "dq"
  label:
    en_US: "Send Email"
    zh_Hans: "发送邮件"
    pt_BR: "Send Email"
    ja_JP: "メール送信"
description:
  human:
    en_US: "Send an email via configured SMTP server"
    zh_Hans: "通过配置的 SMTP 服务器发送电子邮件"
    pt_BR: "Send an email via configured SMTP server"
    ja_JP: "設定された SMTP サーバー経由でメールを送信"
  llm: "Send an email to the specified recipient with the given subject and body content."
parameters:
  - name: to_email
    type: string
    required: true
    label:
      en_US: "Recipient Email"
      zh_Hans: "收件人邮箱"
      pt_BR: "Recipient Email"
      ja_JP: "受信者メールアドレス"
    human_description:
      en_US: "The email address of the recipient"
      zh_Hans: "收件人的邮箱地址"
      pt_BR: "The email address of the recipient"
      ja_JP: "受信者のメールアドレス"
    llm_description: "The email address of the recipient, e.g. user@example.com"
    form: llm
  - name: subject
    type: string
    required: true
    label:
      en_US: "Subject"
      zh_Hans: "邮件主题"
      pt_BR: "Subject"
      ja_JP: "件名"
    human_description:
      en_US: "The subject of the email"
      zh_Hans: "邮件的主题"
      pt_BR: "The subject of the email"
      ja_JP: "メールの件名"
    llm_description: "The subject line of the email"
    form: llm
  - name: body
    type: string
    required: true
    label:
      en_US: "Email Body"
      zh_Hans: "邮件正文"
      pt_BR: "Email Body"
      ja_JP: "メール本文"
    human_description:
      en_US: "The body content of the email"
      zh_Hans: "邮件的正文内容"
      pt_BR: "The body content of the email"
      ja_JP: "メールの本文内容"
    llm_description: "The main content of the email body"
    form: llm
output_schema:
  type: object
  properties:
    status:
      type: string
      description: "Send status: success or error"
    message:
      type: string
      description: "Result message"
    from:
      type: string
      description: "Sender email address"
    to:
      type: string
      description: "Recipient email address"
    subject:
      type: string
      description: "Email subject"
    timestamp:
      type: string
      description: "Send timestamp (ISO 8601 format)"
    error_type:
      type: string
      description: "Error type if failed: connection_timeout, auth_failed, invalid_address, unknown"
extra:
  python:
    source: tools/email_pro.py
